# Render Blueprint: deploys the ForgeAI dashboard as a free web service.
# Ollama can't run on the free instance, so the hosted version calls a hosted
# model through an OpenAI-compatible API (Gemini by default). Set OPENAI_API_KEY
# in Render. To use Groq instead: OPENAI_BASE_URL=https://api.groq.com/openai/v1,
# FORGE_MODEL=llama-3.1-8b-instant.
services:
  - type: web
    name: forgeai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FORGE_BACKEND
        value: openai
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: FORGE_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_API_KEY
        sync: false
